name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

# 结果（截图、自检输出、构建日志的要紧部分）推到 ci-results 分支，方便不登录也能取回来看
permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 苹果芯片的 macOS 机器常常排不上，英特尔芯片的同时排一份，各出各的结果。
    # 英特尔那台只编译、出真机的包，不跑模拟器（PikPak 的 SDK 没有 x86_64 模拟器的版本）
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          mkdir -p out
          {
            sw_vers
            xcodebuild -version
            swift --version 2>&1 | head -2
            uname -m
          } | tee out/environment.txt

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Kotlin 一侧的全部代码（共用模块 + iOS 入口）打成静态框架，Xcode 工程链接它
      - name: Build Kotlin framework
        id: kotlin
        run: |
          set -o pipefail
          # 模拟器那份用调试构建（链接快），真机那份用发布构建（界面流畅得多），各链接一次，再拼成一个 xcframework
          DEVICE=iosKit/build/bin/iosArm64/releaseFramework/PikSeekKit.framework
          SIMULATOR=iosKit/build/bin/iosSimulatorArm64/debugFramework/PikSeekKit.framework
          if [ "$(uname -m)" = x86_64 ]; then
            TASKS=":iosKit:linkReleaseFrameworkIosArm64 -Ppikseek.deviceOnly=true"
            FRAMEWORKS="-framework $DEVICE"
          else
            TASKS=":iosKit:linkReleaseFrameworkIosArm64 :iosKit:linkDebugFrameworkIosSimulatorArm64"
            FRAMEWORKS="-framework $DEVICE -framework $SIMULATOR"
          fi
          bash ./gradlew $TASKS \
            "-Porg.gradle.java.installations.paths=$JAVA_HOME" --console=plain \
            2>&1 | tee out/kotlin-ios.full.log | grep -E "^e: |^> Task .*(FAILED)|BUILD|What went wrong" || true
          grep -q "BUILD SUCCESSFUL" out/kotlin-ios.full.log
          mkdir -p iosApp/Frameworks
          rm -rf iosApp/Frameworks/PikSeekKit.xcframework
          xcodebuild -create-xcframework $FRAMEWORKS -output iosApp/Frameworks/PikSeekKit.xcframework
          # Swift 一侧照着这份头文件实现接口：留一份要紧的声明，对不上时好查
          HEADER=$(find iosApp/Frameworks/PikSeekKit.xcframework -name PikSeekKit.h | head -1)
          grep -nE "^@(interface|protocol) |^- |^\+ |^@property" "$HEADER" | grep -nE -A40 "(HttpBridge|KeychainBridge|MpvPlayerBridge|MpvEvents|FrameGrabberBridge|NativeServices|HttpResult|KeychainItem|GrabbedFrame|PikSeekIos)\b" | cut -c1-300 | head -400 > out/kotlin-header.txt || true

      - name: Generate Xcode project
        run: |
          which xcodegen || brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for simulator
        if: runner.arch == 'ARM64'
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project PikSeek.xcodeproj -scheme PikSeek -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee ../out/build-simulator.full.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          test -f build/Build/Products/Debug-iphonesimulator/PikSeek.app/PikSeek

      - name: Run in simulator
        if: runner.arch == 'ARM64'
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime in sorted(data, reverse=True):
              if 'iOS' not in runtime: continue
              for device in data[runtime]:
                  if device['name'].startswith('iPhone') and device['isAvailable']:
                      best = device['udid']; print(runtime, device['name'], file=sys.stderr); break
              if best: break
          print(best or '')")
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=iosApp/build/Build/Products/Debug-iphonesimulator/PikSeek.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$UDID" dev.pikseek.ios
          sleep 12
          xcrun simctl io "$UDID" screenshot out/launch.png
          DATA=$(xcrun simctl get_app_container "$UDID" dev.pikseek.ios data)
          cp "$DATA"/Library/Application\ Support/PikSeek/logs/*.log out/ 2>/dev/null || true
          xcrun simctl terminate "$UDID" dev.pikseek.ios || true
          # 自检：不联网、不登录。认证存储、播放（含系统播放器播不了的格式）、时间轴预览
          SIMCTL_CHILD_PIKSEEK_SELFTEST=1 xcrun simctl launch "$UDID" dev.pikseek.ios
          for i in $(seq 1 40); do
            sleep 3
            if [ "$i" = 5 ]; then xcrun simctl io "$UDID" screenshot out/selftest-playing.png; fi
            if grep -qE "ALL PASS|FAILED" "$DATA/Documents/selftest.txt" 2>/dev/null; then break; fi
          done
          xcrun simctl io "$UDID" screenshot out/selftest.png
          cp "$DATA/Documents/selftest.txt" out/selftest.txt 2>/dev/null || echo "no selftest.txt" > out/selftest.txt
          xcrun simctl terminate "$UDID" dev.pikseek.ios || true
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "PikSeek"' --style compact 2>/dev/null | tail -200 > out/simulator-log.txt || true

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project PikSeek.xcodeproj -scheme PikSeek -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../out/build-device.full.log | grep -E "error:|BUILD|\*\*" || true
          APP=build/Build/Products/Release-iphoneos/PikSeek.app
          test -f "$APP/PikSeek"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ../PikSeek-unsigned.ipa Payload
          ls -l ../PikSeek-unsigned.ipa | tee ../out/ipa.txt

      - name: Upload ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PikSeek-unsigned-ipa-${{ matrix.runner }}
          path: PikSeek-unsigned.ipa
          retention-days: 14

      # 未签名的包挂到仓库的 Releases 下（预发布），不登录也能下；装到手机上用 AltStore 加自己的 Apple ID 签
      - name: Publish ipa
        if: success() && runner.arch == 'ARM64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          RESULT=$(tail -1 out/selftest.txt 2>/dev/null || echo "no self-test")
          gh release create "$TAG" PikSeek-unsigned.ipa --prerelease --target "$GITHUB_SHA" \
            --title "PikSeek iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned ipa built from ${GITHUB_SHA}. Simulator self-test: ${RESULT}. Sign it yourself (AltStore / Sideloadly) to install."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PikSeek-unsigned.ipa" | tee out/ipa-url.txt

      - name: Publish results
        if: always()
        run: |
          for LOG in out/*.full.log; do
            [ -f "$LOG" ] || continue
            { grep -nE "^e: |error:|fatal|Undefined symbol|ld: |What went wrong|BUILD (SUCCEEDED|SUCCESSFUL|FAILED)" "$LOG" | cut -c1-400 | head -250; echo "----- tail -----"; tail -60 "$LOG" | cut -c1-400; } > "${LOG%.full.log}.log"
            rm "$LOG"
          done
          echo "run=${GITHUB_RUN_NUMBER} runner=${{ matrix.runner }} sha=${GITHUB_SHA} status=${{ job.status }} kotlin=${{ steps.kotlin.outcome }} at=$(date -u +%FT%TZ)" > out/RESULT.txt
          cd out
          git init -q -b ci-results-${{ matrix.runner }}
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "run ${GITHUB_RUN_NUMBER} on ${{ matrix.runner }} for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results-${{ matrix.runner }}
