org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
# 工具链只用 gw.ps1 指过来的那份 JDK（项目内 _runtime/pikseek/jdk），不自动下载、不去翻系统里装的
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false

# iOS targets only build on macOS (the GitHub workflow); on Windows they are skipped without a warning per task
kotlin.native.ignoreDisabledTargets=true
